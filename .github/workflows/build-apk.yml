name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'index-farshad-v13-corrected.html'
      - 'scripts/**'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Select v13 app HTML
        run: |
          test -s index-farshad-v13-corrected.html || (echo 'Missing v13 HTML file.' && exit 1)
          cp index-farshad-v13-corrected.html index.html
      - name: Require app HTML and Firebase config
        run: |
          test -s index.html || (echo 'Missing or empty app HTML.' && exit 1)
          test -s app/google-services.json || (echo 'Missing app/google-services.json' && exit 1)
          python3 scripts/patch-index-for-android.py
          python3 -m pip install --quiet Pillow
          python3 scripts/optimize-embedded-image.py
          grep -Fq "window.AndroidBridge.copyText(txt)" index.html
          grep -Fq "window.AndroidBridge.saveTextFile('backup-hesab-ab.json'" index.html
          grep -Fq "window.AndroidBridge.saveImageToGalleryBase64(btoa(binary),name)" index.html
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Create CI debug keystore and print fingerprints
        run: |
          mkdir -p "$HOME/.config/.android"
          base64 --decode app/ci-debug-keystore.b64 > "$HOME/.config/.android/debug.keystore"
          chmod 600 "$HOME/.config/.android/debug.keystore"
          gradle signingReport
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Farshad-Water-Invoice-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
